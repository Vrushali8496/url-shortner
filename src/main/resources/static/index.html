<!DOCTYPE html>
<html>
<head>
    <title>URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">
        <h3 class="text-center mb-4">URL Shortener</h3>

        <div class="mb-3">
            <input type="text" id="urlInput" class="form-control"
                   placeholder="Enter long URL (https://example.com)">
        </div>

        <!-- ✅ New Custom Code Field -->
        <div class="mb-3">
            <input type="text" id="customCodeInput" class="form-control"
                   placeholder="Custom short code (optional, e.g. mygithub)">
        </div>

        <div class="d-grid">
            <button class="btn btn-success" onclick="shortenUrl()">Shorten URL</button>
        </div>

        <div id="error" class="text-danger mt-3"></div>
        <div id="result" class="mt-4"></div>
    </div>
</div>

<script>

function isValidURL(string) {
    try {
        new URL(string);
        return true;
    } catch (_) {
        return false;
    }
}

function shortenUrl() {

    const longUrl = document.getElementById("urlInput").value.trim();
    const customCode = document.getElementById("customCodeInput").value.trim();

    const errorDiv = document.getElementById("error");
    const resultDiv = document.getElementById("result");

    errorDiv.innerHTML = "";
    resultDiv.innerHTML = "";

    if (!longUrl) {
        errorDiv.innerHTML = "Please enter a URL.";
        return;
    }

    if (!isValidURL(longUrl)) {
        errorDiv.innerHTML = "Invalid URL format!";
        return;
    }

    fetch("/shorten" , {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            url: longUrl,
            customCode: customCode || null   // ✅ send custom code if entered
        })
    })
    .then(response => response.json())
    .then(data => {

        if (data.error) {
            throw new Error(data.error);
        }

        const shortUrl = data.shortUrl;
        const shortCode = shortUrl.split("/").pop();

        resultDiv.innerHTML = `
            <p><strong>Short URL:</strong></p>
            <a href="${shortUrl}" target="_blank">${shortUrl}</a>

            <br><br>

            <button class="btn btn-primary btn-sm"
                onclick="getStats('${shortCode}')">
                View Click Stats
            </button>

            <div id="stats" class="mt-3"></div>
        `;
    })
    .catch(error => {
        errorDiv.innerHTML = "Error: " + error.message;
    });
}

function getStats(code) {

    fetch("/stats/" + code)
    .then(response => response.json())
    .then(data => {

        if (data.error) {
            throw new Error(data.error);
        }

        document.getElementById("stats").innerHTML =
            `<p><strong>Original URL:</strong> ${data.originalUrl}</p>
             <p><strong>Click Count:</strong> ${data.clickCount}</p>`;
    })
    .catch(error => {
        document.getElementById("stats").innerHTML =
            `<p class="text-danger">${error.message}</p>`;
    });
}

</script>

</body>
</html>
